<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="wcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ncard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="ycard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>

  <!-- title -->
  <text x="80" y="88" fill="#f8fafc" font-size="44" font-weight="700">FrontDoor</text>
  <text x="80" y="124" fill="#94a3b8" font-size="20">One assistant faces the people. A team of agents does the work. One mailbox ties them together.</text>

  <!-- PEOPLE column -->
  <text x="80" y="210" fill="#64748b" font-size="14" font-weight="700" letter-spacing="2">PEOPLE</text>
  <g filter="url(#shadow)">
    <rect x="80" y="230" width="300" height="88" rx="16" fill="#1e293b" stroke="#334155"/>
    <rect x="80" y="344" width="300" height="88" rx="16" fill="#1e293b" stroke="#334155"/>
    <rect x="80" y="458" width="300" height="88" rx="16" fill="#1e293b" stroke="#334155"/>
  </g>
  <circle cx="122" cy="274" r="18" fill="#f59e0b"/><text x="122" y="281" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">You</text>
  <text x="156" y="268" fill="#f8fafc" font-size="20" font-weight="600">The owner</text>
  <text x="156" y="294" fill="#94a3b8" font-size="15">Telegram DM, any time</text>

  <circle cx="122" cy="388" r="18" fill="#a78bfa"/><text x="122" y="394" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Fam</text>
  <text x="156" y="382" fill="#f8fafc" font-size="20" font-weight="600">Family</text>
  <text x="156" y="408" fill="#94a3b8" font-size="15">Telegram, allow-listed, own language</text>

  <circle cx="122" cy="502" r="18" fill="#64748b"/><text x="122" y="508" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">@</text>
  <text x="156" y="496" fill="#f8fafc" font-size="20" font-weight="600">Everyone else</text>
  <text x="156" y="522" fill="#94a3b8" font-size="15">Email, only after the owner approves</text>

  <!-- arrows people -> William -->
  <g stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)">
    <path d="M384 274 C 470 274, 480 330, 560 350"/>
    <path d="M384 388 L 560 388"/>
    <path d="M384 502 C 470 502, 480 446, 560 426"/>
  </g>

  <!-- WILLIAM card -->
  <g filter="url(#glow)" opacity="0.35"><rect x="580" y="250" width="380" height="280" rx="28" fill="#f59e0b"/></g>
  <g filter="url(#shadow)">
    <rect x="580" y="250" width="380" height="280" rx="28" fill="url(#wcard)"/>
  </g>
  <text x="610" y="296" fill="#1c1917" font-size="14" font-weight="700" letter-spacing="2">FRONT DOOR</text>
  <text x="610" y="346" fill="#0f172a" font-size="42" font-weight="800">William</text>
  <text x="610" y="378" fill="#1c1917" font-size="17">Claude Code · Telegram channel</text>
  <g fill="#1c1917" font-size="16">
    <text x="610" y="420">• receives every request</text>
    <text x="610" y="446">• routes it to the right agent</text>
    <text x="610" y="472">• the only one who talks to people</text>
    <text x="610" y="498">• calendar, bills, reminders, week plan</text>
  </g>

  <!-- mailbox bus -->
  <rect x="1010" y="360" width="60" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <path d="M1022 378 h36 v26 h-36 z M1022 378 l18 14 l18 -14" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1040" y="446" text-anchor="middle" fill="#94a3b8" font-size="13">one shared mailbox</text>
  <text x="1040" y="464" text-anchor="middle" fill="#94a3b8" font-size="13">routed by subject line</text>

  <g stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)">
    <path d="M964 390 L 1006 390"/>
    <path d="M1074 378 C 1120 330, 1150 300, 1196 282"/>
    <path d="M1074 402 C 1120 450, 1150 480, 1196 498"/>
  </g>

  <!-- NICA card -->
  <g filter="url(#shadow)"><rect x="1200" y="200" width="320" height="170" rx="24" fill="url(#ncard)"/></g>
  <text x="1226" y="236" fill="#fdf2f8" font-size="13" font-weight="700" letter-spacing="2">PERSONAL</text>
  <text x="1226" y="280" fill="#ffffff" font-size="34" font-weight="800">Nica</text>
  <text x="1226" y="308" fill="#fce7f3" font-size="15">Meta Muse</text>
  <text x="1226" y="340" fill="#fdf2f8" font-size="14">family logistics · home · errands · health appts</text>

  <!-- WILLY card -->
  <g filter="url(#shadow)"><rect x="1200" y="420" width="320" height="170" rx="24" fill="url(#ycard)"/></g>
  <text x="1226" y="456" fill="#f0f9ff" font-size="13" font-weight="700" letter-spacing="2">PROFESSIONAL</text>
  <text x="1226" y="500" fill="#ffffff" font-size="34" font-weight="800">Willy</text>
  <text x="1226" y="528" fill="#e0f2fe" font-size="15">OpenAI Dots</text>
  <text x="1226" y="560" fill="#f0f9ff" font-size="14">fundraising · PTO · school · business · job search</text>

  <!-- shared log note -->
  <path d="M1360 374 L 1360 416" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1376" y="400" fill="#94a3b8" font-size="12">both read every protocol email</text>

  <!-- subject line sample -->
  <g filter="url(#shadow)"><rect x="580" y="600" width="940" height="150" rx="20" fill="#0b1220" stroke="#334155"/></g>
  <text x="608" y="636" fill="#64748b" font-size="13" font-weight="700" letter-spacing="2">THE PROTOCOL, IN ONE LINE</text>
  <text x="608" y="676" fill="#e2e8f0" font-size="22" font-family="SF Mono, Menlo, Consolas, monospace">William to Nica: book the dentist follow-up, week of Oct 13 [#a0007]</text>
  <text x="608" y="712" fill="#94a3b8" font-size="15">&lt;From&gt; to &lt;To&gt;: &lt;topic&gt; [#id]  ·  reply by flipping the names and keeping the id  ·  every agent logs every message</text>
  <text x="608" y="736" fill="#94a3b8" font-size="15">kinds: request · status · question · done · fyi  ·  agents email agents freely; humans hear only from William</text>

  <!-- left-bottom: how it runs -->
  <g filter="url(#shadow)"><rect x="80" y="600" width="460" height="150" rx="20" fill="#0b1220" stroke="#334155"/></g>
  <text x="108" y="636" fill="#64748b" font-size="13" font-weight="700" letter-spacing="2">HOW WILLIAM RUNS</text>
  <g fill="#cbd5e1" font-size="15">
    <text x="108" y="668">launchd keeper → tmux → Claude Code session</text>
    <text x="108" y="694">heartbeat every 30 min · DMs answered in real time</text>
    <text x="108" y="720">all memory on disk · sessions recycle, nothing is lost</text>
  </g>

  <text x="1520" y="860" text-anchor="end" fill="#475569" font-size="13">github.com/artesanobuilds/frontdoor</text>
</svg>
